[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-lm"
version = "0.1.0"
description = "Evidence-driven testbed for small-language-model capability and efficiency optimizations"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "tokenizers",
]

[project.optional-dependencies]
test = ["pytest"]
# Only `modern_lm.serve` needs these; training and evaluation must not.
serve = ["fastapi", "uvicorn", "pydantic"]
# CUDA 13 Transformer Engine backend for FP8 and NVFP4 projection training.
# This stays optional so CPU development and the accepted BF16 path remain
# lightweight. Nightly PyTorch builds may compile the small framework binding.
low-precision = ["transformer-engine[pytorch,core-cu13]==2.18.0"]

[tool.setuptools.packages.find]
where = ["src"]

# serve.py reads the playground page from disk at request time, so it has to
# survive installation as package data rather than staying a source-tree file.
[tool.setuptools.package-data]
modern_lm = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
