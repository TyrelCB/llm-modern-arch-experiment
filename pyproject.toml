[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-lm"
version = "0.1.0"
description = "Capacity-matched dense modern-architecture baseline vs the DeepSeek-V4 reference"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "tokenizers",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
